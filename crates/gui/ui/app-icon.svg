<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Plate Gradients -->
    <linearGradient id="plate_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242834"/>
      <stop offset="100%" stop-color="#12151c"/>
    </linearGradient>
    <linearGradient id="plate_border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Inner Ambient Lighting -->
    <radialGradient id="plate_glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Shadow beneath mark -->
    <filter id="mark_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Elevated App Icon Squircle Plate -->
  <rect x="14" y="14" width="228" height="228" rx="52" fill="url(#plate_grad)" stroke="url(#plate_border)" stroke-width="2.5"/>
  <rect x="14" y="14" width="228" height="228" rx="52" fill="url(#plate_glow)"/>

  <!-- Centered Chiral Twist Mark with Ambient Elevation Shadow -->
  <g filter="url(#mark_shadow)">
  <path d="M 128.0,42.0 L 202.49,85.0 L 161.08,108.82 L 86.59,65.82 Z" fill="#ff385c" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 202.49,85.0 L 202.49,171.0 L 161.08,147.18 L 161.08,108.82 Z" fill="#be123c" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 161.08,108.82 L 161.08,147.18 L 128.0,128.0 L 128.0,89.63 Z" fill="#9f1239" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 202.48,171.0 L 127.99,214.01 L 128.08,166.24 L 202.56,123.23 Z" fill="#38bdf8" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 127.99,214.01 L 53.52,171.01 L 94.85,147.05 L 128.08,166.24 Z" fill="#1d4ed8" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 128.08,166.24 L 94.85,147.05 L 128.0,128.0 L 161.23,147.18 Z" fill="#1e3a8a" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 53.52,171.0 L 53.52,84.99 L 94.85,108.95 L 94.85,194.96 Z" fill="#ffd13b" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 53.52,84.99 L 127.99,41.99 L 128.08,89.76 L 94.85,108.95 Z" fill="#f59e0b" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M 94.85,108.95 L 128.08,89.76 L 128.0,128.0 L 94.77,147.18 Z" fill="#c27803" stroke="#07090e" stroke-width="2.8" stroke-linejoin="round"/>
  </g>
</svg>