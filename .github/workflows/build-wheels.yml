name: Build wheels

# Build and verify every distribution this project ships
on:
  workflow_call:
    inputs:
      verify:
        description: >-
          Install each built wheel on the interpreter it claims to serve and run the suite against it.
        type: boolean
        default: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  UV_NO_PROGRESS: 1

jobs:
  # One stable ABI wheel per platform covers CPython 3.10+
  abi3:
    name: abi3 ${{ matrix.platform.target }} (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, target: armv7, manylinux: auto }
          - { runner: ubuntu-latest, target: ppc64le, manylinux: auto }
          - { runner: ubuntu-latest, target: s390x, manylinux: auto }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64 }
          - { runner: windows-latest, target: x86 }
          - { runner: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-abi3-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'default' }}
          path: dist

  # The free-threaded build cannot load a stable ABI wheel, so it needs one wheel per version.
  # PyO3 0.29 supports 3.14t and later. CPython supported free-threading in 3.14.
  freethreaded:
    name: ${{ matrix.python }} ${{ matrix.platform.target }} (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Add "3.15t" when released. The crate builds and the suite passes on 3.15t already,
        # but it is only the runner image that is not there yet.
        # PEP 803's `abi3t` will eventually replace this whole list with one forward-compatible wheel.
        python: ["3.14t"]
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64 }
          - { runner: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --interpreter ${{ matrix.python }}
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python }}-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux || 'default' }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # The desktop interface is a second distribution. It is built here so that a  release
  # cannot ship a library whose `[gui]` extra points at a version of `twistypuzzle-gui`
  # that was never built, and without it on the index, `twistypuzzle[gui]` does not resolve at all.
  gui:
    name: Desktop wheel ${{ matrix.platform.target }} (${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: macos-latest, target: aarch64 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: "true"
          # `auto`, not `off`. A build outside the manylinux container is
          # tagged `linux_x86_64`, which PyPI refuses to accept, so the
          # publish step below would fail on an artifact that built fine.
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          # The crate has its own pyproject.toml beside its Cargo.toml, and
          # maturin reads the metadata from whichever directory it runs in.
          # This matches what `pixi run gui-wheel` does.
          working-directory: crates/gui
          # winit needs the X11 and Wayland development headers to build, even
          # for a binary that will run under neither. They have to be inside
          # the manylinux container (not on the runner). The compile happens in
          # the container, so an apt-get on the host would install them where
          # the build cannot see them. Different manylinux images can use
          # different package managers.
          before-script-linux: |
            if command -v yum >/dev/null 2>&1; then
              yum install -y libxkbcommon-devel wayland-devel libxcb-devel
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev
            else
              echo "Unsupported package manager in manylinux container" >&2
              exit 1
            fi
      - uses: actions/upload-artifact@v7
        with:
          name: gui-wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: crates/gui/dist

  # Install each wheel on the interpreter and test it.
  verify:
    name: Verify ${{ matrix.python }} wheels
    if: inputs.verify
    needs: [abi3, freethreaded]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          # Only the library's own wheels. `gui-wheels-*` is a different
          # distribution and is verified by its own build.
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # Install the *extra*.
      # `--only-binary :all:` is to ensure that the sdist is in `dist` too.
      # Without it a missing wheel would be silently built from source.
      - name: Install from the built wheels only
        run: |
          uv pip install --system pytest
          uv pip install --system --no-index --only-binary :all: \
            --find-links dist "twistypuzzle[gym]"

      # Before the gym extra is used, test that the core does not need it.
      - name: The core package must not need the optional dependencies
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import subprocess, sys, textwrap
          probe = textwrap.dedent('''
              import sys
              sys.modules['gymnasium'] = None
              sys.modules['numpy'] = None
              import twistypuzzle
              print(twistypuzzle.__version__)
          ''')
          subprocess.run([sys.executable, '-c', probe], check=True)
          "

      - name: Tests
        working-directory: ${{ runner.temp }}
        run: pytest -q "${{ github.workspace }}/tests/python" --import-mode=importlib

      - name: The module must not re-enable the GIL
        if: endsWith(matrix.python, 't')
        run: |
          python -X gil=0 -c "
          import sys, twistypuzzle
          assert not sys._is_gil_enabled(), 'importing twistypuzzle re-enabled the GIL'
          assert twistypuzzle.free_threaded
          print('free-threaded, GIL stays off')
          "
